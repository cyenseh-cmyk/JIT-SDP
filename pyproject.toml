[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apachejit-bench"
version = "0.1.0"
description = "Reproducible ApacheJIT preparation and pooled temporal model comparison"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "imbalanced-learn>=0.12,<1", "torch>=2.2,<3", "joblib>=1.3,<2", "tqdm>=4.66,<5"]

[project.scripts]
jit-sdp = "jit_sdp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

